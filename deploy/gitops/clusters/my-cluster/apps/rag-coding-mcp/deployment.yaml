apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-coding-mcp
  namespace: rag-coding-mcp-ns
  labels:
    app: rag-coding-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rag-coding-mcp
  template:
    metadata:
      labels:
        app: rag-coding-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: rag-coding-mcp
          image: registry.bizrader.uk/rag-coding-mcp:0.3.3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RAG_DB_PATH
              value: /data/rag.db
            - name: RAG_HOST
              value: 0.0.0.0
            - name: RAG_PORT
              value: "8080"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rag-coding-mcp-data
